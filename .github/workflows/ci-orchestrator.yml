name: VETTA Orquestrador pelo Chat

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch a testar
        required: true
        type: string
      mode:
        description: auto, full ou published
        required: true
        default: full
        type: choice
        options: [auto, full, published]

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  parse:
    name: Validar comando fechado
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.parse.outputs.valid }}
      branch: ${{ steps.parse.outputs.branch }}
      mode: ${{ steps.parse.outputs.mode }}
      allow_published: ${{ steps.parse.outputs.allow_published }}
      exists: ${{ steps.exists.outputs.exists }}
    steps:
      - name: Baixar regras do orquestrador
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Interpretar comando sem executar texto livre
        id: parse
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_MODE: ${{ inputs.mode }}
        run: node scripts/ci/parse-command.mjs >> "$GITHUB_OUTPUT"

      - name: Confirmar existência da branch
        id: exists
        if: ${{ steps.parse.outputs.valid == 'true' }}
        shell: bash
        env:
          TARGET_BRANCH: ${{ steps.parse.outputs.branch }}
        run: |
          if git ls-remote --exit-code origin "refs/heads/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Executar cobertura escolhida pelo agente
    needs: parse
    if: ${{ needs.parse.outputs.valid == 'true' && needs.parse.outputs.exists == 'true' }}
    uses: vitoohugo333/VETTA/.github/workflows/ci-engine.yml@main
    with:
      target_ref: ${{ needs.parse.outputs.branch }}
      target_branch: ${{ needs.parse.outputs.branch }}
      mode: ${{ needs.parse.outputs.mode }}
      allow_published: ${{ needs.parse.outputs.allow_published == 'true' }}
    permissions:
      contents: read
      id-token: write

  report:
    name: Devolver resultado ao issue
    needs: [parse, test]
    if: ${{ always() && github.event_name == 'issue_comment' && needs.parse.outputs.valid == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Publicar conclusão operacional
        uses: actions/github-script@v7
        env:
          TARGET_BRANCH: ${{ needs.parse.outputs.branch }}
          BRANCH_EXISTS: ${{ needs.parse.outputs.exists }}
          TEST_RESULT: ${{ needs.test.result }}
        with:
          script: |
            const branch = process.env.TARGET_BRANCH;
            const exists = process.env.BRANCH_EXISTS === 'true';
            const result = process.env.TEST_RESULT;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body;
            if (!exists) {
              body = `❌ A branch \`${branch}\` não existe. Nenhum teste foi executado.`;
            } else if (result === 'success') {
              body = `✅ Teste autônomo concluído para \`${branch}\`. Evidência: ${runUrl}`;
            } else {
              body = `❌ O teste autônomo encontrou falha em \`${branch}\`. Logs e evidências: ${runUrl}`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
