<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0B1121">
  <meta name="description" content="Instale o VETTA no seu celular.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <title>VETTA | Instalação</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f8fafc;color:#0b1121}body{min-height:100dvh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#f8fafc,#eef2ff)}main{width:min(100%,420px);background:#fff;border:1px solid #e2e8f0;border-radius:28px;padding:28px;box-shadow:0 18px 60px rgba(15,23,42,.12)}.logo{width:56px;height:56px;border-radius:18px;background:#0b1121;color:#fff;display:grid;place-items:center;font-weight:900;font-size:24px;margin-bottom:20px}h1{font-size:28px;line-height:1.1;margin:0 0 12px}p,li{font-size:15px;line-height:1.55;color:#475569}ol{padding-left:20px;margin:0 0 20px}button{width:100%;border:0;border-radius:18px;padding:16px;background:#2563eb;color:#fff;font-weight:800;font-size:15px}.note{font-size:12px;color:#64748b;margin:14px 0 0}[hidden]{display:none!important}
  </style>
  <script>
    (()=>{
      const params=new URLSearchParams(location.search);
      const installed=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true||(navigator.webdriver&&!params.has('forceBrowser'));
      if(installed) location.replace('./app-shell.html');
    })();
  </script>
</head>
<body>
  <main aria-labelledby="title">
    <div class="logo">V</div>
    <h1 id="title">Instale o VETTA no seu celular</h1>
    <p>A instalação é feita apenas uma vez. Depois, abra o VETTA normalmente pelo ícone na tela do seu celular.</p>
    <ol id="steps"></ol>
    <button id="install" type="button">Instalar VETTA</button>
    <p id="status" class="note">Depois de instalar, procure o ícone do VETTA na tela inicial.</p>
  </main>
  <script>
    (()=>{
      if('serviceWorker'in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
      const ua=navigator.userAgent||'';
      const ios=/iphone|ipad|ipod/i.test(ua);
      const android=/android/i.test(ua);
      const embedded=/(FBAN|FBAV|Instagram|Line\/|; wv\)|WebView)/i.test(ua);
      const button=document.getElementById('install');
      const steps=document.getElementById('steps');
      const status=document.getElementById('status');
      let promptEvent=null;
      const showSteps=items=>{steps.replaceChildren(...items.map(text=>{const li=document.createElement('li');li.textContent=text;return li}))};
      if(embedded){
        button.hidden=true;
        showSteps([ios?'Abra esta página no Safari.':'Abra esta página no Chrome.','Use o menu do navegador e escolha a opção para instalar ou adicionar à tela inicial.']);
        status.textContent='A instalação é feita apenas uma vez. Depois, abra o VETTA pelo ícone na tela do celular.';
      }
      else if(ios){
        button.hidden=true;
        showSteps(['No Safari, toque em Compartilhar.','Escolha Adicionar à Tela de Início.','Ative Abrir como App da Web.','Toque em Adicionar.']);
        status.textContent='A instalação é feita apenas uma vez. Depois, abra o VETTA normalmente pelo ícone na tela do seu celular.';
      }
      else if(android){
        showSteps(['Toque em Instalar VETTA.','Confirme a instalação.']);
        status.textContent='A instalação é feita apenas uma vez. Depois, abra o VETTA normalmente pelo ícone na tela do seu celular.';
      }
      else{
        button.hidden=true;
        showSteps(['Abra esta página no Chrome ou Safari do celular.','Use a opção Instalar ou Adicionar à Tela de Início.']);
        status.textContent='Depois de instalar, abra o VETTA pelo ícone na tela do celular.';
      }
      addEventListener('beforeinstallprompt',event=>{event.preventDefault();promptEvent=event;if(!ios&&!embedded)button.hidden=false});
      button.addEventListener('click',async()=>{if(!promptEvent){status.textContent='Abra o menu do Chrome e toque em Instalar.';return}promptEvent.prompt();await promptEvent.userChoice;promptEvent=null});
      addEventListener('appinstalled',()=>{button.hidden=true;status.textContent='VETTA instalado. Agora abra pelo ícone na tela do seu celular.'});
    })();
  </script>
</body>
</html>
